# 投资日报：每日定时抓取持仓新闻 + 财报，去重后发 Gmail
name: 投资日报

on:
  schedule:
    # 北京时间 8:00 = UTC 0:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_invest_daily:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行投资日报
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          # 投资雷达 LLM 评分（无 key 则 scorer 自动 fallback 到全 B 级）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCORER_LLM_PROVIDER: anthropic
          SCORER_LLM_MODEL: claude-sonnet-4-6
          # 雪球大V抓取保持关闭：CI 上没有 chrome_profile/ 登录态，开了会失败
          # ENABLE_XUEQIU: '1'
          # YouTube 默认开启；字幕禁用的视频用 Gemini 2.5 Flash 直读 fallback
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python invest_daily.py

      - name: 保存去重记录 + 13F 快照 (Commit & Push)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          [ -f invest_history.json ] && git add invest_history.json
          [ -d sec_13f_snapshots ] && git add sec_13f_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "invest: update history + 13F snapshots [skip ci]"
            git push
          fi

  notify_on_failure:
    needs: run_invest_daily
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发送失败告警邮件
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/send_failure_alert.py
