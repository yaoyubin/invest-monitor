# 投资雷达 watchlist
#
# holdings: 已持仓的标的，雷达每日检查 thesis 是否被增强或削弱（thesis delta）
# candidates: 尚未持仓但关注的标的，雷达每日检查 entry trigger 是否命中
#
# 字段说明：
# - thesis: 持有的核心理由（雷达据此判断信息是支持还是削弱原判断）
# - red_flags: 让我重新评估或卖出的信号
# - why_not_buying_now: 现在不买的具体理由（写不出来就不该放进 candidates）
# - revisit_triggers: 满足任一就把该标的升为 A 级提醒，可验证、可观测，避免模糊词
#
# 纪律：candidates 不超过 10 只；季度复盘一次，触发过未行动的要么删除要么升级为持仓

holdings:
  AMD:
    name: AMD
    market: us
    thesis:
      - AI GPU revenue growth 持续超预期
      - Data Center 占比提升带动毛利率改善
      - CPU + GPU + networking + software 平台化进展
      - 与 NVIDIA 的差距是否缩小
    red_flags:
      - AI GPU guidance 下修
      - 毛利率不升反降
      - 大客户转向自研 ASIC
      - HBM/CoWoS 封装瓶颈持续
      - 知名基金（ARK/Berkshire/Tiger Global/景林/高瓴 等）大额减持，且满足以下任一：清仓 / 单季减持超 30% / 连续两季减持。仅"小幅减持"或"再平衡"不算

  TSLA:
    name: Tesla
    market: us
    thesis:
      - FSD 进展和监管放行
      - 汽车毛利率企稳
      - Robotaxi 商业化时间表
      - Optimus 量产路径
    red_flags:
      - 交付量持续下滑
      - 毛利率压力扩大
      - FSD 重大事故/监管收紧

  TSM:
    name: TSMC
    market: us
    thesis:
      - 先进制程（3nm/2nm）份额垄断
      - AI capex 拉动 CoWoS 需求
      - 美国/日本/欧洲产能扩张顺利
    red_flags:
      - 大客户砍单
      - 地缘政治升级（台海/出口管制）
      - 制程良率事故

  TCEHY:
    name: Tencent
    market: us
    thesis:
      - 游戏业务恢复增长
      - 广告业务受益于视频号
      - 持续大额回购
      - WeChat 生态优势
      - AI/云业务期权价值
    red_flags:
      - 游戏监管收紧
      - 宏观消费持续走弱
      - 回购明显放缓

  BILI:
    name: Bilibili
    market: us
    thesis:
      - 广告业务变现率提升
      - 游戏业务自研突破
      - 经营杠杆释放、利润率改善
    red_flags:
      - DAU/MAU 增长停滞
      - 毛利率倒退
      - 现金流持续为负

  MPNGY:
    name: MeiTuan
    market: us
    thesis:
      - 本地生活护城河
      - 即时零售业务成长
      - 海外（Keeta）扩张
    red_flags:
      - 抖音等竞争压力扩大
      - 海外亏损扩大无清晰路径
      - 监管打压外卖费率

  IBIT:
    name: Bitcoin ETF
    market: us
    thesis:
      - 比特币长期价值储存逻辑
      - ETF 资金持续净流入
    red_flags:
      - ETF 大额净流出
      - 监管政策反转

  BTC:
    name: BTC
    market: crypto
    thesis:
      - 长期价值储存
      - 减半周期供需逻辑
    red_flags:
      - 主要经济体禁令
      - 大型交易所/稳定币崩盘

candidates:
  INTC:
    name: Intel
    market: us
    why_not_buying_now:
      - 代工业务持续亏损
      - 制程仍落后 TSMC 1-2 代
      - AI GPU 故事尚未兑现
    revisit_triggers:
      - 新 CEO 上任后首份财报营收/毛利超预期
      - 拿到外部大客户代工订单（NVDA / QCOM / AAPL / AMD）
      - 18A 制程量产时间确认且良率公开披露
      - CHIPS 法案具体拨款落地或追加投资
      - 美国政府入股或战略投资公开

  0981.HK:
    name: SMIC 中芯国际
    market: hk
    why_not_buying_now:
      - 当前不盈利，估值偏贵
      - 美国制裁限制先进设备进口
    revisit_triggers:
      - 国内 AI 芯片大客户（华为昇腾/寒武纪）量产订单确认
      - N+2/N+3 制程良率突破公开数据
      - 季度毛利率连续两季改善
      - 资本开支指引大幅上修
      - 国家大基金或产业链重大资本运作

  GOOGL:
    name: Alphabet (Google)
    market: us
    why_not_buying_now:
      - 搜索业务被 AI Chat（ChatGPT/Perplexity）持续蚕食的中长期风险
      - 反垄断诉讼判决待执行（可能强制拆分搜索/广告业务）
      - 当前估值已 priced in Cloud / Gemini 高增长预期
    revisit_triggers:
      - Gemini 应用层 MAU/DAU 明确赶超 ChatGPT
      - 搜索 query 量同比恢复正增长（停止下滑）
      - 反垄断诉讼达成不损主业的和解
      - Cloud 季度营收同比 >35%（脱离自然衰减）
      - Waymo 商业化营收明确披露
      - 大资金继续加仓（已发生：Berkshire 2026 Q1 +204% 至 $15.6B）

  NVDA:
    name: NVIDIA
    market: us
    why_not_buying_now:
      - 已持有 AMD 做 AI GPU 敞口，不想过度集中
      - 估值偏高（PE 50+），AI capex 周期顶部风险未释放
      - 客户集中度高（前 5 大客户占营收 50%+）
      - 中国出口管制对 H20 等阉割版需求不确定
    revisit_triggers:
      - 数据中心营收同比仍 >50%（不见顶迹象）
      - Blackwell / Rubin 主力客户超预期订单（如 META、MSFT、AMZN、ORCL 公开追加）
      - 大幅回调超 30%（估值修复机会）
      - 推理（inference）市场份额维持 >70%（ASIC 未冲击）
      - 中国出口管制实质放松（H20+ 系列恢复出口）

  RKLB:
    name: Rocket Lab
    market: us
    why_not_buying_now:
      - Neutron 中型火箭尚未首飞，关键里程碑未达
      - 持续亏损，盈利路径长
      - 卫星制造业务利润率低
      - 小型火箭市场拥挤（SpaceX Starlink + Falcon 9 主导）
    revisit_triggers:
      - Neutron 火箭首飞成功 + 商业订单确认
      - 美国政府/国防大额合同（如 NSSL、SDA Tranche）
      - 季度 EBITDA 转正
      - 卫星业务接到大单（如 Globalstar、政府卫星采购）
      - Electron 发射成功率持续 >95% 且单价上调

  # TODO: 沐曦集成电路 (MetaX) — 国产 AI 芯片。
  # ticker 待确认：A 股科创板（SH688xxx）/ 港股新股 / 还未 IPO。
  # 现在用 MetaX 占位，确认后改 key 为真实 ticker，market 改 a/hk
  MetaX:
    name: 沐曦集成电路 (MetaX)
    market: hk    # 占位，待确认
    why_not_buying_now:
      - 国内 AI 芯片竞争激烈（华为昇腾、寒武纪、海光、燧原、壁仞）
      - 先进制程受限（不能用最新 TSMC，依赖 SMIC N+1/N+2）
      - 营收规模相对小，盈利路径未明
      - 新股估值通常偏高
    revisit_triggers:
      - 拿到头部互联网/政府客户量产订单（如阿里 / 字节 / 国家算力中心）
      - 季度营收同比 >100% 且毛利率持续改善
      - 制程突破（SMIC N+2 量产 + 良率公开披露）
      - 美国对国产替代加大力度（如 H20 出口禁令加码）
      - 公开盈亏平衡时间表

